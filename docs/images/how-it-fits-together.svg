<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">How Ultimate POS is deployed on shared cPanel</title><desc id="desc">Diagram showing a browser connecting to a static frontend on the main cPanel domain, which calls a Laravel API on a separate subdomain connected to a MySQL database. Private application files and secrets stay outside the public web root.</desc>
<rect width="1200" height="460" rx="26" fill="#111d30"/><text x="600" y="54" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">How the pieces fit together</text><text x="600" y="81" font-family="Arial,sans-serif" font-size="14" fill="#aebdd1" text-anchor="middle">A practical deployment shape for regular shared cPanel hosting</text>
<g><rect x="48" y="135" width="226" height="188" rx="18" fill="#1b2d46" stroke="#3b5270"/><rect x="78" y="160" width="166" height="95" rx="9" fill="#edf4fb"/><rect x="78" y="160" width="166" height="17" rx="8" fill="#d5e2f0"/><circle cx="91" cy="169" r="3" fill="#ef7b70"/><circle cx="102" cy="169" r="3" fill="#e8bd56"/><circle cx="113" cy="169" r="3" fill="#47c6a5"/><rect x="93" y="191" width="63" height="8" rx="4" fill="#c4d5e8"/><rect x="93" y="207" width="130" height="6" rx="3" fill="#d7e2ee"/><rect x="93" y="220" width="108" height="6" rx="3" fill="#d7e2ee"/><text x="161" y="283" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Customer browser</text><text x="161" y="304" font-family="Arial,sans-serif" font-size="12" fill="#b4c3d6" text-anchor="middle">Laptop • tablet • POS PC</text></g>
<g><rect x="358" y="135" width="230" height="188" rx="18" fill="#173b45" stroke="#2c9b8c"/><rect x="388" y="162" width="170" height="65" rx="10" fill="#e4fbf5"/><text x="473" y="189" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#116f67" text-anchor="middle">Static frontend</text><text x="473" y="209" font-family="Arial,sans-serif" font-size="12" fill="#397d78" text-anchor="middle">Next.js export</text><text x="473" y="263" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Main domain</text><text x="473" y="285" font-family="Arial,sans-serif" font-size="12" fill="#b9d9d7" text-anchor="middle">example.com</text><text x="473" y="304" font-family="Arial,sans-serif" font-size="11" fill="#9cc8c3" text-anchor="middle">public_html</text></g>
<g><rect x="671" y="135" width="230" height="188" rx="18" fill="#233252" stroke="#6587d9"/><rect x="701" y="162" width="170" height="65" rx="10" fill="#eaf0ff"/><text x="786" y="189" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#3459aa" text-anchor="middle">Laravel API</text><text x="786" y="209" font-family="Arial,sans-serif" font-size="12" fill="#5974b3" text-anchor="middle">PHP • REST endpoints</text><text x="786" y="263" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">API subdomain</text><text x="786" y="285" font-family="Arial,sans-serif" font-size="12" fill="#c0cde8" text-anchor="middle">api.example.com</text><text x="786" y="304" font-family="Arial,sans-serif" font-size="11" fill="#aebee0" text-anchor="middle">Document root: backend/public</text></g>
