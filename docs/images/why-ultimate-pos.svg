<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Why use Ultimate POS</title><desc id="desc">Illustrated workflow connecting products, checkout, inventory, and sales reporting in one browser-based workspace.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef9f7"/><stop offset="1" stop-color="#eef3ff"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17b890"/><stop offset="1" stop-color="#3388f4"/></linearGradient></defs><rect width="1200" height="420" rx="26" fill="url(#bg)"/><text x="600" y="57" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#142238">From stockroom to checkout — one connected workflow</text><text x="600" y="84" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#5f7189">Designed to bring everyday store operations into one browser-based workspace</text>
<g><rect x="52" y="126" width="244" height="218" rx="20" fill="#fff"/><rect x="78" y="152" width="62" height="62" rx="17" fill="#e6f8f3"/><path d="M91 170h36v29H91z M91 179h36 M103 170v29 M115 170v29" fill="none" stroke="#139d80" stroke-width="3"/><text x="78" y="251" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15243a">Products</text><text x="78" y="278" font-family="Arial,sans-serif" font-size="14" fill="#66768c">Organize catalog</text><text x="78" y="300" font-family="Arial,sans-serif" font-size="14" fill="#66768c">and customer records.</text></g>
<g><rect x="340" y="126" width="244" height="218" rx="20" fill="#fff"/><rect x="366" y="152" width="62" height="62" rx="17" fill="#e8f1ff"/><rect x="379" y="165" width="36" height="36" rx="5" fill="none" stroke="#3377d5" stroke-width="3"/><path d="M385 176h24 M385 184h24 M385 192h14" stroke="#3377d5" stroke-width="2.5"/><text x="366" y="251" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15243a">Checkout</text><text x="366" y="278" font-family="Arial,sans-serif" font-size="14" fill="#66768c">Record sales and</text><text x="366" y="300" font-family="Arial,sans-serif" font-size="14" fill="#66768c">verify stock availability.</text></g>
<g><rect x="628" y="126" width="244" height="218" rx="20" fill="#fff"/><rect x="654" y="152" width="62" height="62" rx="17" fill="#fff2dc"/><path d="M670 170h30v30h-30z M670 179h30 M680 170v30 M690 170v30" fill="none" stroke="#bd7b17" stroke-width="3"/><text x="654" y="251" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15243a">Inventory</text><text x="654" y="278" font-family="Arial,sans-serif" font-size="14" fill="#66768c">Track stock changes</text><text x="654" y="300" font-family="Arial,sans-serif" font-size="14" fill="#66768c">and stock movements.</text></g>
<g><rect x="916" y="126" width="244" height="218" rx="20" fill="#fff"/><rect x="942" y="152" width="62" height="62" rx="17" fill="#f0eaff"/><path d="M954 199v-13h9v13 M969 199v-25h9v25 M984 199v-35h9v35" fill="none" stroke="#8154ce" stroke-width="3" stroke-linecap="round"/><text x="942" y="251" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15243a">Sales overview</text><text x="942" y="278" font-family="Arial,sans-serif" font-size="14" fill="#66768c">Review sales history</text><text x="942" y="300" font-family="Arial,sans-serif" font-size="14" fill="#66768c">and basic metrics.</text></g>
<g stroke="url(#g)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M301 234h31l-8 -8 M332 234l-8 8"/><path d="M589 234h31l-8 -8 M620 234l-8 8"/><path d="M877 234h31l-8 -8 M908 234l-8 8"/></g>
