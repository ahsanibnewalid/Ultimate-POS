name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - run: test -f out/index.html
  backend:
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_pgsql, pdo_mysql, mbstring, dom, curl, sqlite3, pdo_sqlite
          coverage: none
      - working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - working-directory: backend
        run: find app routes config database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - working-directory: backend
        run: vendor/bin/phpunit


  mysql-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ultimate_pos
          MYSQL_USER: pos
          MYSQL_PASSWORD: pos-test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -upos -ppos-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom, curl
          coverage: none
      - working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Run migration and feature tests on MySQL
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ultimate_pos
          DB_USERNAME: pos
          DB_PASSWORD: pos-test-password
        run: vendor/bin/phpunit
      - name: Validate the phpMyAdmin bootstrap SQL
        env:
          DB_PASSWORD: pos-test-password
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -uroot -proot-test-password -e "CREATE DATABASE ultimate_pos_bootstrap"
          mysql -h 127.0.0.1 -uroot -proot-test-password -e "GRANT ALL PRIVILEGES ON ultimate_pos_bootstrap.* TO 'pos'@'%'"
          mysql -h 127.0.0.1 -uroot -proot-test-password ultimate_pos_bootstrap < deployment/cpanel/mysql-schema.sql
          DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=ultimate_pos_bootstrap DB_USERNAME=pos DB_PASSWORD="$DB_PASSWORD" php backend/artisan migrate:status --no-ansi

  cpanel-package:
    needs: [frontend, backend, mysql-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_pgsql, mbstring, dom, curl, sqlite3, pdo_sqlite
          coverage: none
      - working-directory: frontend
        run: |
          npm install
          npm run build
          test -f out/index.html
      - name: Assemble uploadable cPanel package
        run: |
          mkdir -p cpanel-package/public_html cpanel-package/ultimate-pos-backend
          cp -a frontend/out/. cpanel-package/public_html/
          cp -a backend/. cpanel-package/ultimate-pos-backend/
          cp deployment/cpanel/mysql-schema.sql cpanel-package/mysql-schema.sql
          cp deployment/cpanel/README.md cpanel-package/INSTALL-README.md
          cp deployment/cpanel/backend.env.example cpanel-package/ultimate-pos-backend/.env.example
          cd cpanel-package/ultimate-pos-backend
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          cd ../..
          zip -qr Ultimate-POS-cPanel.zip cpanel-package
      - uses: actions/upload-artifact@v4
        with:
          name: Ultimate-POS-cPanel
          path: Ultimate-POS-cPanel.zip
          if-no-files-found: error
          retention-days: 14
